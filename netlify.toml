[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# Convenience shortcut only; Umami account login protects the analytics.
[[redirects]]
from = "/studio-insights-7c39/*"
to = "https://cloud.umami.is/"
status = 302
force = true

[[redirects]]
from = "/studio-insights-7c39"
to = "https://cloud.umami.is/"
status = 302
force = true

# Serve a translated missing-page response for unknown Bangla URLs.
[[redirects]]
from = "/bn/*"
to = "/bn/404/index.html"
status = 404

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
